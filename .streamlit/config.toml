# Dark-first theme. These values are the design tokens used by ui.py and charts.py.
[theme]
base = "dark"
primaryColor = "#056DFF"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#111111"
textColor = "#EEEEEE"
borderColor = "#262626"
baseRadius = "0.5rem"
font = "sans-serif"

[server]
maxUploadSize = 500
